/**:
  ros__parameters:
    # --- I2C / PCA9685 ---
    i2c_bus: 7
    i2c_address: 0x40
    pwm_freq_hz: 50.0
    servo_channel: 0
    motor_channel: 3

    # --- OE pin: Jetson Nano 40-pin header GPIO09 == BOARD pin 7 ---
    oe_gpio_mode: "BOARD"
    oe_gpio_pin: 7

    # --- Steering servo (microseconds) ---
    servo_center_us: 1500      # 90 deg / straight
    servo_min_us: 1000
    servo_max_us: 2000
    max_steering_angle: 0.5    # rad that maps to full servo travel
    steering_direction: 1      # set to -1 to reverse steering

    # --- Motor ESC (microseconds) ---
    motor_neutral_us: 1500     # stop
    motor_min_us: 1000         # full reverse
    motor_max_us: 2000         # full forward
    max_speed: 2.0             # m/s that maps to full throttle
    motor_direction: 1         # set to -1 to reverse drive

    # --- I/O ---
    input_topic: "ackermann_cmd"
    command_timeout: 0.5       # s; no command -> neutral failsafe
