# Course plan, in driving order. Plain YAML read by mission_manager.
# Edit speeds/distances here; per-behavior gains live in tuning.yaml.
# Turn directions follow the course drawing. Distances are approximate from the
# drawing and should be checked on the real course.

marker_skip_max: 2           # a marker up to N zones ahead jumps straight there
marker_skip_min_time_s: 2.0
marker_lead_m: 1.3           # act on a marker after driving this far (it's seen ahead)
axle_to_camera: 0.38         # MEASURE rear axle to ZED camera (the odometry point)

# Bucket-field exit relative to the field (fixed on the day; entrance/buckets move):
# depth = from the entrance line to the exit, from_wall = exit centre from the
# side wall on the `wall` side. MEASURE on the real course.
exit_hint: {depth: 4.0, wall: right, from_wall: 1.05, approach: 1.8}

# Helix entry: with a large turning radius the truck must enter toward the
# helix's outer side to stay concentric. The offset ($helix_offset) is
# computed from vehicle.planning_min_turn_radius; it is 0 once R <= ~1.2 m.
helix_entry: {centerline: 1.22, margin: 0.05, max_offset: 0.25}

zones:
  - name: start
    speed_cap: 1.5
    timeout_s: 20
    steps:
      - behavior: wall_center
        params: {speed: 1.5}
        until: [terrain=ramp_up, marker=ramp_up]

  # 20% straight ramp up to a 25" bridge. Lidar is gated off while tilted, so
  # this is heading-hold on the direction lined up in the start corridor,
  # shifted right (helix outer side) by $helix_offset (0.25 m at R=1.52, 0 at R=1.2).
  - name: ramp_up
    speed_cap: 0.9
    timeout_s: 12
    steps:
      - behavior: heading_hold
        params: {speed: 0.9, lateral_offset: -$helix_offset}
        until: [left=ramp_up]

  # Turn must start at the bridge end. The zone starts when the IMU sees the
  # ramp top (~0.3 m late), so distance = bridge length - 0.3. MEASURE the bridge.
  - name: bridge
    speed_cap: 0.5
    timeout_s: 10
    allow_marker_skip: false
    steps:
      - behavior: heading_hold
        params: {speed: 0.5}
        until: [distance>=1.5, terrain=ramp_down]

  # 270 deg left helix, ~4 ft centreline radius, 11% down, ~6" rails (90% sure).
  # Asks for the centreline radius; if the truck can't turn that tight it
  # holds full lock and relies on $helix_offset to stay near-concentric.
  - name: helix
    speed_cap: 0.5
    timeout_s: 30
    allow_marker_skip: false     # must start exactly at the ramp-down, not early
    steps:
      - behavior: arc_turn
        params: {direction: left, turn_deg: 270, radius: 1.22, speed: 0.5, allow_kturn: false}
        until: [done]

  # 5 ft tunnel under the bridge, then the 32" x 10 ft corridor. Undo the
  # entry offset first (the helix exits off the tunnel axis by the same amount).
  - name: tunnel
    speed_cap: 1.0
    timeout_s: 15
    steps:
      - behavior: heading_hold
        params: {speed: 0.4, lateral_offset: $helix_offset, distance: 1.3}
      - behavior: wall_center
        params: {speed: 1.0}
        until: [distance>=3.0, marker=narrow]

  # 20" straight, then a 28" wide right curve (~6 ft radius) into the gravel lane.
  # wall_center under-steers on curves this tight (inner wall vanishes);
  # follow-the-gap with a short horizon passes cleanly in simulation.
  - name: narrow
    speed_cap: 0.5
    timeout_s: 30
    steps:
      - behavior: gap_follow
        params: {speed: 0.5, max_range: 1.5, free_range: 0.5, bubble_radius: 0.2, min_width: 0.25}
        until: [yaw>=75, marker=gravel, terrain=rough]
        after_distance: 2.0

  # 2" ramp, 4x8 ft pea gravel, 2" ramp down, flat. Walled lane, so centre on
  # the walls (heading_hold would lock whatever heading the curve exit left).
  - name: gravel
    speed_cap: 0.8
    timeout_s: 15
    steps:
      - behavior: wall_center
        params: {speed: 0.8, distance: 4.0}
        until: [done, marker=bank_approach]

  - name: bank_approach
    speed_cap: 1.0
    timeout_s: 15
    steps:
      - behavior: wall_center
        params: {speed: 0.8}
        until: [opening_ahead>=1.2, terrain=bank]
        after_distance: 1.0

  # 8.5 deg banked plane, no walls, lidar blind (tilted): a 180 deg right
  # multi-point turn kept inside an odometry box. bounds = [ahead_min, ahead_max,
  # left_min, left_max] from where the turn starts; MEASURE on the course
  # (plane 48" deep + apron, return lane centre ~1.37 m to the right).
  - name: bank_uturn
    speed_cap: 0.6
    timeout_s: 40
    allow_marker_skip: false
    steps:
      - behavior: k_turn
        params: {direction: right, turn_deg: 180, leg_speed: 0.4, leg_max_distance: 2.5,
                 rev_leg_max_distance: 0.5, max_legs: 12, bounds: [0.05, 1.45, -1.95, 0.8]}
        until: [done]

  - name: pothole
    speed_cap: 0.7
    timeout_s: 20
    steps:
      # 96" flat lane to the potholes.
      - behavior: wall_center
        params: {speed: 0.7}
        until: [terrain=rough, distance>=2.6]
        after_distance: 1.0
      # 1.5" ramp, holes/bumps, 1.5" ramp down: walled lane, centre on walls.
      - behavior: wall_center
        params: {speed: 0.6, distance: 3.6}
        until: [done, marker=wide]

  # 11x26 ft area with decoy bales. Turn left (south), then search the LEFT
  # wall for the bucket-zone entrance. Decoy notches fail the depth test.
  - name: wide
    speed_cap: 0.9
    timeout_s: 60
    steps:
      - behavior: arc_turn
        params: {direction: left, turn_deg: 90, radius: 1.6, speed: 0.6, allow_kturn: true}
        until: [done]
      # Search = follow the left wall (fallback block). On a confirmed opening:
      # line up, turn onto the opening's axis (from wall geometry), then hand
      # over to the bucket zone (a bucket may sit right behind the entrance).
      - nav2: {goal: gap, side: left, entry: turn_in}
        fallback:
          behavior: wall_center
          params: {speed: 0.5, follow: left, wall_target: 0.8}
        until: [done]
        timeout_s: 45

  # 2-9 buckets; exit is a 36" opening on the far side, lower right.
  - name: buckets
    speed_cap: 0.7
    timeout_s: 60
    steps:
      # Buckets and the entrance move for every run; the field walls and the exit
      # don't. Follow-the-gap (always obstacle-aware) toward $exit_approach (on the
      # exit axis, `approach` m before it), then toward $exit_through (just past
      # the exit). Simulation: ~75% of random layouts at R=1.2-1.52; failures are
      # layouts needing many reversing points.
      # Nav2 alternative (struggled with reverse cusps here in simulation):
      #   - nav2: {goal: relative, frame: gap, forward: 4.0, left: 0.4, nav_timeout_s: 25}
      # Clear the entrance mouth first; the exit is estimated from inside the field.
      - behavior: gap_follow
        params: {speed: 0.4, goal_heading_abs: $gap_yaw, goal_heading_gain: 1.0, max_range: 1.5,
                 free_range: 0.5, bubble_radius: 0.25, min_width: 0.3, distance: 0.8}
      - behavior: gap_follow
        params: {speed: 0.4, goal_point: $exit_approach, goal_radius: 0.5, goal_heading_gain: 1.0,
                 max_range: 1.5, free_range: 0.5, bubble_radius: 0.25, min_width: 0.3,
                 distance: 10.0}
        until: [done, marker=hoops]
      - behavior: gap_follow
        params: {speed: 0.4, goal_point: $exit_through, goal_radius: 0.3, goal_heading_gain: 1.0,
                 max_range: 1.5, free_range: 0.5, bubble_radius: 0.25, min_width: 0.3,
                 distance: 6.0}
        until: [done, marker=hoops]

  # Two hoops 96" apart in a 72" lane, a right U-turn with a third hoop, then
  # the lane to the car wash. Each gate: follow the line through its centre;
  # back up first if too close to make the sideways shift (R=1.52 needs ~2.7 m
  # run-up for the worst 1.1 m offset at 45 deg intercept).
  - name: hoops
    speed_cap: 0.8
    timeout_s: 120
    steps:
      - gate: {beyond: 0.6, search_forward: 1.0, commit_speed: 0.5, max_approach_deg: 45}
      - gate: {beyond: 0.6, search_forward: 1.0, commit_speed: 0.5, max_approach_deg: 45}
      - behavior: arc_turn
        params: {direction: right, turn_deg: 90, radius: 1.6, speed: 0.6, allow_kturn: true}
      - gate: {beyond: 0.6, search_forward: 1.0, commit_speed: 0.5, max_approach_deg: 45}
      - behavior: arc_turn
        params: {direction: right, turn_deg: 90, radius: 1.6, speed: 0.6, allow_kturn: true}

  # Ribbons fool both sensors: ignore the front cone, hold heading, go fast.
  # Ends on distance only (overshooting the line costs nothing; stopping short does).
  - name: car_wash
    speed_cap: 1.8
    timeout_s: 15
    steps:
      - behavior: heading_hold
        params: {speed: 1.8, center_gain: 0.5, center_max_width: 1.6, ignore_front_deg: 60,
                 distance: 9.0}
        until: [done]

  - name: finish
    speed_cap: 0.0
    allow_marker_skip: false
    steps:
      - behavior: stop
        until: [time>=0.3]
